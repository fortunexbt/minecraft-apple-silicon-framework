name: Fixtures
on:
  push:
    branches: [main]
    paths-ignore:
      - "contributions/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.webp"
  pull_request:
    paths-ignore:
      - "contributions/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.webp"
permissions:
  contents: read
concurrency:
  group: fixtures-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . ruff==0.16.9
      - run: python -m unittest discover -s tests -v
      - run: silicon-shader --help
      - run: python -m py_compile workloads/overworld-v1/*.pyj recipes/m4-wide24/sampler/import_capture.py
      - run: node --check site/app.js
      - name: Validate every published contribution with the current validators
        run: python -m silicon_shader.registry contributions "$RUNNER_TEMP/data.json"
      - run: ruff check silicon_shader tests --select F
      - run: ruff format silicon_shader tests --check
  sampler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./sampler/smoke.sh
