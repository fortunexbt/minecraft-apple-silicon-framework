[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-shader"
version = "0.2.0"
description = "Find, try and share Minecraft shader setups for Apple Silicon"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Silicon Shader contributors"}]
dependencies = []

[project.scripts]
silicon-shader = "silicon_shader.cli:main"

[tool.setuptools]
packages = ["silicon_shader"]
include-package-data = false

[project.urls]
Repository = "https://github.com/fortunexbt/minecraft-apple-silicon-framework"
Documentation = "https://github.com/fortunexbt/minecraft-apple-silicon-framework/blob/main/docs/WORKFLOW.md"

[tool.setuptools.package-data]
silicon_shader = ["skills/*/SKILL.md", "workloads/*.json"]
