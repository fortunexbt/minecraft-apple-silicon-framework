[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-shader"
version = "0.2.0"
description = "A bounded, evidence-led Minecraft shader tuning workbench for Apple Silicon"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Silicon Shader contributors"}]
dependencies = []

[project.scripts]
silicon-shader = "silicon_shader.cli:main"

[tool.setuptools]
packages = ["silicon_shader"]

[project.urls]
Repository = "https://github.com/fortunexbt/minecraft-apple-silicon-framework"
Documentation = "https://github.com/fortunexbt/minecraft-apple-silicon-framework/blob/main/docs/WORKFLOW.md"

[tool.setuptools.package-data]
silicon_shader = ["skills/*/SKILL.md"]
